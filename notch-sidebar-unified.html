<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Notch Sidebar — Reference Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --glass-bg: rgba(13, 27, 42, 0.72);
    --glass-border: rgba(255, 255, 255, 0.1);
    --text-primary: #F8F9FA;
    --text-secondary: #94a3b8;
    --accent-purple: #8b3bff;
    --accent-green: #00d890;
    --collapsed-w: 52px;
    --expanded-w: 296px;
    --radius-collapsed: 22px;
    --radius-expanded: 20px;
    --transition-timing: cubic-bezier(.32, .72, 0, 1);
    --transition-duration: 260ms;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 30% 20%, #16321f 0%, #0a1a12 45%, #060d0a 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    color: var(--text-primary);
    overflow: hidden;
  }

  /* ---- demo-only chrome (not part of the notch component) ---- */

  .demo-topbar {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    gap: 6px;
    padding: 4px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    backdrop-filter: blur(16px);
  }

  .demo-topbar button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 150ms ease, color 150ms ease;
  }

  .demo-topbar button.active {
    background: var(--accent-purple);
    color: white;
  }

  .demo-topbar button:not(.active):hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-primary);
  }

  .demo-label {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-secondary);
    text-align: center;
    z-index: 5;
    opacity: 0.6;
  }

  .fake-map-controls {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    overflow: hidden;
    backdrop-filter: blur(12px);
  }

  .fake-map-controls button {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 15px;
    cursor: pointer;
  }

  .fake-map-controls button:hover { background: rgba(255,255,255,0.06); }

  /* ---- snap zone indicators (shown while dragging) ---- */

  .snap-zone {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 64px;
    z-index: 30;
    pointer-events: none;
    background: linear-gradient(to var(--fade-dir, right), rgba(139, 59, 255, 0.18), transparent);
    opacity: 0;
    transition: opacity 150ms ease;
  }

  .snap-zone.left { left: 0; --fade-dir: right; }
  .snap-zone.right { right: 0; --fade-dir: left; }
  .snap-zone.visible { opacity: 1; }
  .snap-zone.hover { background: linear-gradient(to var(--fade-dir, right), rgba(139, 59, 255, 0.38), transparent); }

  /* =========================================================
     THE NOTCH COMPONENT
     ========================================================= */

  .notch {
    position: fixed;
    top: 50%;
    left: 12px;
    transform: translateY(-50%);
    z-index: 50;
    width: var(--collapsed-w);
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    background: var(--glass-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: var(--radius-collapsed);
    overflow: hidden;
    cursor: default;
    transition:
      width var(--transition-duration) var(--transition-timing),
      border-radius var(--transition-duration) var(--transition-timing),
      left var(--transition-duration) var(--transition-timing),
      right var(--transition-duration) var(--transition-timing);
  }

  /* docked-left: flat edge on the left (edge-facing side) */
  .notch.dock-left {
    left: 12px;
    right: auto;
    border-top-left-radius: 0;
    border-bottom-left-radius: 0;
    border-top: 1px solid var(--glass-border);
    border-right: 1px solid var(--glass-border);
    border-bottom: 1px solid var(--glass-border);
    border-left: none;
  }

  /* docked-right: flat edge on the right, everything mirrors */
  .notch.dock-right {
    left: auto;
    right: 12px;
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
    border-top: 1px solid var(--glass-border);
    border-left: 1px solid var(--glass-border);
    border-bottom: 1px solid var(--glass-border);
    border-right: none;
  }

  .notch.expanded {
    width: var(--expanded-w);
    border-radius: var(--radius-expanded);
  }
  .notch.expanded.dock-left { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .notch.expanded.dock-right { border-top-right-radius: 0; border-bottom-right-radius: 0; }

  .notch.dragging {
    transition: none;
    cursor: grabbing;
  }

  /* ---- drag handle (edge-facing flat side) ---- */

  .drag-handle {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    z-index: 2;
  }
  .notch.dock-left .drag-handle { left: -2px; }
  .notch.dock-right .drag-handle { right: -2px; }

  .drag-handle::before {
    content: "";
    width: 3px;
    height: 24px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.22);
    box-shadow: 6px 0 0 rgba(255, 255, 255, 0.22);
  }
  .notch.dock-right .drag-handle::before {
    box-shadow: -6px 0 0 rgba(255, 255, 255, 0.22);
  }

  /* ---- row list ---- */

  .notch-rows {
    display: flex;
    flex-direction: column;
    padding: 8px 0;
    gap: 2px;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .notch-rows::-webkit-scrollbar { display: none; }

  .notch-row {
    display: flex;
    align-items: center;
    height: 48px;
    padding: 0 8px;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    overflow: hidden;
    transition:
      max-height var(--transition-duration) var(--transition-timing),
      opacity var(--transition-duration) var(--transition-timing),
      background 150ms ease;
    max-height: 48px;
    opacity: 1;
  }

  .notch-row.row-leaving {
    max-height: 0;
    opacity: 0;
    padding-top: 0;
    padding-bottom: 0;
  }
  .notch-row.row-entering {
    animation: row-fade-in var(--transition-duration) var(--transition-timing);
  }
  @keyframes row-fade-in {
    from { opacity: 0; max-height: 0; }
    to { opacity: 1; max-height: 48px; }
  }

  .notch-row:hover { background: rgba(255, 255, 255, 0.05); }

  .row-icon-wrap {
    position: relative;
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--row-accent, var(--accent-purple));
    background: color-mix(in srgb, var(--row-accent, var(--accent-purple)) 16%, transparent);
  }

  .row-icon-wrap svg { width: 18px; height: 18px; }

  .row-dot {
    position: absolute;
    top: -2px;
    right: -2px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff4d4d;
    border: 2px solid #0D1B2A;
  }

  .row-text {
    margin-left: 12px;
    min-width: 0;
    flex: 1;
    display: none;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }
  .notch.expanded .row-text { display: flex; }

  .row-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row-preview {
    font-size: 11.5px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .row-badge {
    display: none;
    flex-shrink: 0;
    margin-left: 8px;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-secondary);
    font-size: 10.5px;
    font-weight: 600;
    font-family: 'IBM Plex Mono', monospace;
  }
  .notch.expanded .row-badge.has-count { display: block; }

  /* ---- pin control (bottom of expanded state) ---- */

  .notch-pin {
    display: none;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 16px;
    border-top: 1px solid var(--glass-border);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    flex-shrink: 0;
    transition: color 150ms ease, background 150ms ease;
  }
  .notch.expanded .notch-pin { display: flex; }
  .notch-pin:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); }
  .notch-pin.pinned { color: var(--accent-green); }
  .notch-pin svg { width: 14px; height: 14px; flex-shrink: 0; }

</style>
</head>
<body>

  <div class="demo-topbar" role="group" aria-label="Demo mode switcher (not part of the notch component)">
    <button class="mode-btn active" data-mode="explore">Explore</button>
    <button class="mode-btn" data-mode="monitor">Monitor</button>
    <button class="mode-btn" data-mode="survey">Survey</button>
  </div>



  <div class="snap-zone left" id="snapLeft"></div>
  <div class="snap-zone right" id="snapRight"></div>

  <nav class="notch dock-left" id="notch" aria-label="Panel access">
    <div class="drag-handle" id="dragHandle" aria-hidden="true"></div>
    <div class="notch-rows" id="notchRows"></div>
    <div class="notch-pin" id="pinToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
      <span id="pinLabel">Pin open</span>
    </div>
  </nav>

  <div class="demo-label">Hover to expand · drag the edge handle to dock left/right · switch modes above</div>

<script>
(() => {
  const ICONS = {
    layers: '<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
    alerts: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    weather: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h.79a4.5 4.5 0 1 1 0 9Z"/>',
    nav: '<polygon points="3 11 22 2 13 21 11 13 3 11"/>',
    survey: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/>',
    shelter: '<path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>'
  };

  // Row model: id, label, preview, icon, accent, badge ({type:'dot'|'count', value}), core (bool), modes (array if not core)
  const ROWS = [
    { id: 'layers', label: 'Layers', preview: 'Satellite · Terrain Contours on', icon: 'layers', accent: '#8b3bff', core: true },
    { id: 'alerts', label: 'Live Alerts', preview: '3 active in Central Luzon', icon: 'alerts', accent: '#ff6b6b', core: true, badge: { type: 'count', value: 3 } },
    { id: 'weather', label: 'Weather', preview: '29°C · Light rain', icon: 'weather', accent: '#38bdf8', core: true },
    { id: 'navigation', label: 'Navigation', preview: 'No route set', icon: 'nav', accent: '#00d890', core: true },
    { id: 'survey', label: 'Survey Tools', preview: 'Datum: WGS84 → PRS92', icon: 'survey', accent: '#f59e0b', core: false, modes: ['survey'], badge: { type: 'dot' } },
    { id: 'shelter', label: 'Shelter Locator', preview: '12 shelters nearby', icon: 'shelter', accent: '#a78bfa', core: false, modes: ['monitor'], badge: { type: 'count', value: 12 } },
  ];

  const notch = document.getElementById('notch');
  const rowsContainer = document.getElementById('notchRows');
  const pinToggle = document.getElementById('pinToggle');
  const pinLabel = document.getElementById('pinLabel');
  const dragHandle = document.getElementById('dragHandle');
  const snapLeft = document.getElementById('snapLeft');
  const snapRight = document.getElementById('snapRight');

  let pinned = localStorage.getItem('notch-pinned') === 'true';
  let dockSide = localStorage.getItem('notch-dock') || 'left';
  let currentMode = 'explore';

  function visibleRowIds() {
    return ROWS.filter(r => r.core || r.modes.includes(currentMode)).map(r => r.id);
  }

  function rowIcon(row) {
    const dot = row.badge && row.badge.type === 'dot'
      ? '<span class="row-dot"></span>' : '';
    return `
      <div class="row-icon-wrap" style="--row-accent:${row.accent}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[row.icon]}</svg>
        ${dot}
      </div>`;
  }

  function rowHTML(row) {
    const badge = row.badge && row.badge.type === 'count'
      ? `<span class="row-badge has-count">${row.badge.value}</span>` : '';
    return `
      <div class="notch-row" data-id="${row.id}" tabindex="0" role="button" aria-label="Open ${row.label}">
        ${rowIcon(row)}
        <div class="row-text">
          <span class="row-name">${row.label}</span>
          <span class="row-preview">${row.preview}</span>
        </div>
        ${badge}
      </div>`;
  }

  function renderRows(animate) {
    const wanted = visibleRowIds();
    const existing = new Set([...rowsContainer.children].map(el => el.dataset.id));

    // remove rows no longer wanted, with exit animation
    [...rowsContainer.children].forEach(el => {
      if (!wanted.includes(el.dataset.id)) {
        if (animate) {
          el.classList.add('row-leaving');
          el.addEventListener('transitionend', () => el.remove(), { once: true });
        } else {
          el.remove();
        }
      }
    });

    // add rows newly wanted, in ROWS' defined order
    ROWS.filter(r => wanted.includes(r.id)).forEach((row, i) => {
      if (!existing.has(row.id)) {
        const wrapper = document.createElement('div');
        wrapper.innerHTML = rowHTML(row);
        const el = wrapper.firstElementChild;
        if (animate) el.classList.add('row-entering');
        rowsContainer.insertBefore(el, rowsContainer.children[i] || null);
      }
    });
  }

  renderRows(false);

  rowsContainer.addEventListener('click', (e) => {
    const row = e.target.closest('.notch-row');
    if (!row) return;
    const meta = ROWS.find(r => r.id === row.dataset.id);
    console.log(`[notch] open panel → ${meta.label}`);
    row.style.background = 'rgba(139,59,255,0.16)';
    setTimeout(() => { row.style.background = ''; }, 200);
  });

  // ---- mode switching ----
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      renderRows(true);
    });
  });

  // ---- hover expand / pin ----
  function setExpanded(state) {
    notch.classList.toggle('expanded', state);
  }
  notch.addEventListener('mouseenter', () => setExpanded(true));
  notch.addEventListener('mouseleave', () => { if (!pinned) setExpanded(false); });

  function applyPinState() {
    pinToggle.classList.toggle('pinned', pinned);
    pinLabel.textContent = pinned ? 'Unpin' : 'Pin open';
    if (pinned) setExpanded(true);
  }
  applyPinState();

  pinToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    pinned = !pinned;
    localStorage.setItem('notch-pinned', pinned);
    applyPinState();
    if (!pinned) setExpanded(false);
  });

  // ---- dock side ----
  function applyDockSide(side, animate = true) {
    dockSide = side;
    notch.classList.toggle('dock-left', side === 'left');
    notch.classList.toggle('dock-right', side === 'right');
    if (!animate) {
      notch.classList.add('dragging');
      requestAnimationFrame(() => notch.classList.remove('dragging'));
    }
    localStorage.setItem('notch-dock', side);
  }
  applyDockSide(dockSide, false);

  // ---- drag and snap ----
  let dragging = false;
  let dragStartX = 0;

  dragHandle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dragging = true;
    dragStartX = e.clientX;
    notch.classList.add('dragging');
    snapLeft.classList.add('visible');
    snapRight.classList.add('visible');
    dragHandle.setPointerCapture(e.pointerId);
  });

  dragHandle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - dragStartX;
    notch.style.transform = `translate(${dx}px, -50%)`;

    const midpoint = window.innerWidth / 2;
    const overLeft = e.clientX < midpoint;
    snapLeft.classList.toggle('hover', overLeft);
    snapRight.classList.toggle('hover', !overLeft);
  });

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    notch.style.transform = '';
    notch.classList.remove('dragging');
    snapLeft.classList.remove('visible', 'hover');
    snapRight.classList.remove('visible', 'hover');

    const midpoint = window.innerWidth / 2;
    const side = e.clientX < midpoint ? 'left' : 'right';
    applyDockSide(side, true);
  }

  dragHandle.addEventListener('pointerup', endDrag);
  dragHandle.addEventListener('pointercancel', endDrag);
})();
</script>
</body>
</html>
